.leg-t { font-size: 9px; letter-spacing: 0.08em; color: #6b7280; }

svg { display: block; }

.node text {

// ── D3 SETUP ───────────────────────────────────────────
const svg = d3.select("#mindmap")
  .attr("width", window.innerWidth)
  .attr("height", window.innerHeight);

const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.15, 4])
  .on("zoom", e => g.attr("transform", e.transform));

svg.call(zoom);

// Initial transform
const cx = window.innerWidth / 2;
const cy = window.innerHeight / 2;
const initialTransform = d3.zoomIdentity.translate(cx, cy).scale(0.72);

// Build hierarchy
let root = d3.hierarchy(data);

// Collapse levels >= 2 initially
root.descendants().forEach(d => {
  if (d.depth >= 2 && d.children) {
    d._children = d.children;
    d.children = null;
  }
});

// ── TREE LAYOUT ────────────────────────────────────────
function getTree() {
  return d3.tree()
    .size([2 * Math.PI, 520])
    .separation((a, b) => {
      const base = a.parent === b.parent ? 1 : 1.5;
      return base / (a.depth || 1);
    });
}

// ── LINK PATH ─────────────────────────────────────────
function radialLink(d) {
  const sx = d.source.y * Math.cos(d.source.x - Math.PI / 2);
  const sy = d.source.y * Math.sin(d.source.x - Math.PI / 2);
  const tx = d.target.y * Math.cos(d.target.x - Math.PI / 2);
  const ty = d.target.y * Math.sin(d.target.x - Math.PI / 2);
  const mx = (sx + tx) / 2;
  const my = (sy + ty) / 2;
  // Bezier through midpoint
  return `M${sx},${sy} Q${mx * 1.1},${my * 1.1} ${tx},${ty}`;
}

// ── NODE RADIUS ────────────────────────────────────────
function nodeR(d) {
  if (d.depth === 0) return 42;
  if (d.depth === 1) return d.data.type === 'group' ? 22 : 18;
  return 13;
}

function fontSize(d) {
  if (d.depth === 0) return 11;
  if (d.depth === 1) return 9;
  return 8;
}

// ── TOOLTIP ────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");
const ttName = document.getElementById("tt-name");
const ttDetail = document.getElementById("tt-detail");

function showTooltip(event, d) {
  if (!d.data.detail) return;
  ttName.textContent = d.data.name.replace(/\n/g, ' ');
  ttDetail.textContent = d.data.detail;
  tooltip.style.opacity = 1;
  tooltip.style.left = (event.clientX + 14) + "px";
  tooltip.style.top  = (event.clientY - 10) + "px";
}
function hideTooltip() { tooltip.style.opacity = 0; }

// ── UPDATE ─────────────────────────────────────────────
function update(source) {
  const tree = getTree();
  tree(root);

  const duration = 400;
  const nodes = root.descendants();
  const links = root.links();

  // ── LINKS
  const link = g.selectAll(".link")
    .data(links, d => d.target.data.id);

  link.join(
    enter => enter.append("path")
      .attr("class", "link")
      .attr("d", d => {
        const o = {x: source.x0 || source.x, y: source.y0 || source.y};
        return radialLink({source: o, target: o});
      })
      .attr("stroke", d => (C[d.target.data.type] || C.living).link)
      .attr("stroke-width", d => Math.max(1, 2.5 - d.target.depth * 0.6))
      .attr("opacity", 0.5)
      .transition().duration(duration)
      .attr("d", radialLink),

    update => update.transition().duration(duration)
      .attr("d", radialLink)
      .attr("stroke", d => (C[d.target.data.type] || C.living).link),

    exit => exit.transition().duration(duration)
      .attr("d", d => {
        const o = {x: source.x, y: source.y};
        return radialLink({source: o, target: o});
      })
      .remove()
  );

  // ── NODES
  const node = g.selectAll(".node")
    .data(nodes, d => d.data.id);

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", d => {
      const px = (source.x0 || source.x);
      const py = (source.y0 || source.y);
      const x = py * Math.cos(px - Math.PI/2);
      const y = py * Math.sin(px - Math.PI/2);
      return `translate(${x},${y})`;
    })
    .style("opacity", 0)
    .on("click", (event, d) => { event.stopPropagation(); toggle(d); })
    .on("mouseenter", (event, d) => showTooltip(event, d))
    .on("mouseleave", hideTooltip);

  const cfg = d => C[d.data.type] || C.living;

  // Circle
  nodeEnter.append("circle")
    .attr("r", nodeR)
    .attr("fill", d => cfg(d).fill)
    .attr("stroke", d => cfg(d).stroke);

  // Expand indicator dot
  nodeEnter.append("circle")
    .attr("class", "dot")
    .attr("r", 3)
    .attr("cy", d => nodeR(d) - 1)
    .attr("fill", d => cfg(d).stroke)
    .attr("opacity", d => (d._children || d.children) && d.depth > 0 ? 0.8 : 0);

  // Text lines
  nodeEnter.each(function(d) {
    const el = d3.select(this);
    const lines = d.data.name.split('\n');
    const fs = fontSize(d);
    const lh = fs + 3;
    const totalH = (lines.length - 1) * lh;

    lines.forEach((line, i) => {
      el.append("text")
        .attr("y", -totalH/2 + i * lh)
        .attr("text-anchor", "middle")
        .attr("fill", cfg(d).text)
        .style("font-size", fs + "px")
        .style("font-weight", d.depth <= 1 ? "600" : "400")
        .text(line);
    });
  });

  // Merge and transition
  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(duration)
    .attr("transform", d => {
      const x = d.y * Math.cos(d.x - Math.PI/2);
      const y = d.y * Math.sin(d.x - Math.PI/2);
      return `translate(${x},${y})`;
    })
    .style("opacity", 1);

  // Update dot visibility
  nodeUpdate.select(".dot")
    .attr("opacity", d => (d._children || d.children) && d.depth > 0 ? 0.8 : 0);

  // Exit
  node.exit().transition().duration(duration)
    .attr("transform", d => {
      const x = source.y * Math.cos(source.x - Math.PI/2);
      const y = source.y * Math.sin(source.x - Math.PI/2);
      return `translate(${x},${y})`;
    })
    .style("opacity", 0)
    .remove();

  // Save positions
  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

// ── TOGGLE ────────────────────────────────────────────
function toggle(d) {
  if (d.children) {
    d._children = d.children;
    d.children = null;
  } else if (d._children) {
    d.children = d._children;
    d._children = null;
  }
  update(d);
}

// ── EXPAND ALL ────────────────────────────────────────
function expandAll() {
  root.descendants().forEach(d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  update(root);
}

function collapseAll() {
  root.descendants().forEach(d => {
    if (d.depth >= 2 && d.children) { d._children = d.children; d.children = null; }
  });
  update(root);
}

function resetZoom() {
  svg.transition().duration(500)
    .call(zoom.transform, initialTransform);
}

// ── INIT ──────────────────────────────────────────────
root.x0 = 0; root.y0 = 0;
svg.call(zoom.transform, initialTransform);
update(root);

// ── RESIZE ────────────────────────────────────────────
window.addEventListener('resize', () => {
  svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
});
</script>
</body>
</html>
